name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and OpenCL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ocl-icd-opencl-dev pocl-opencl-icd
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: OpenCL smoke test (PoCL CPU device)
        run: ./build/scollatz --start 1 --end 10000 --backend opencl --chunk 1024
      - name: Genetic algorithm smoke test
        run: ./build/scollatz-ga --population 64 --generations 5 --min 1 --max 100000 --threads 2 --seed 42

      - name: Checkpoint and resume smoke test
        run: |
          ./build/scollatz-ga --backend cpu --population 64 --generations 2 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint build/resume.chk --csv build/first.csv --json build/first.json
          ./build/scollatz-ga --backend cpu --population 64 --generations 4 --islands 4 --min 1 --max 100000 --threads 2 --resume build/resume.chk --checkpoint build/resume.chk --csv build/resumed.csv --json build/resumed.json
          python3 -c "import json; d=json.load(open('build/resumed.json')); assert d['results'] and all('stopping_time' in x for x in d['results'])"

      - name: Per-island OpenCL queues and persistent buffers
        run: ./build/scollatz-ga --backend opencl --population 128 --generations 4 --islands 4 --min 1 --max 100000 --seed 7 --migration-interval 2 --migration-count 2 --checkpoint build/island.chk --csv build/island.csv --json build/island.json
      - name: Adaptive migration opt-out
        run: ./build/scollatz-ga --backend cpu --population 64 --generations 3 --islands 4 --min 1 --max 100000 --seed 7 --no-adaptive-migration --checkpoint build/no-adapt.chk --csv build/no-adapt.csv --json build/no-adapt.json

  rust-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL runtime for PoCL
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ocl-icd-opencl-dev pocl-opencl-icd
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust implementation (including OpenCL)
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Adaptive proof search and certificate round-trip
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-research -- --max-depth 10 --node-limit 100000 --base-limit 2000000 --certificate rust/target/research-certificate.json
          cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-research -- --verify rust/target/research-certificate.json --base-limit 2000000
      - name: Complex branch dynamics smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-complex -- --word 110 --real 3 --imag 1 --repeats 4
      - name: Rust scanner CPU smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz -- --start 1 --end 10000 --backend cpu --threads 2
      - name: Rust scanner OpenCL smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz -- --start 1 --end 10000 --backend opencl --chunk 1024
      - name: Rust GA CPU smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend cpu --population 64 --generations 3 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint rust/target/ga.chk --csv rust/target/ga.csv --json rust/target/ga.json
      - name: Rust GA OpenCL smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend opencl --population 64 --generations 3 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint rust/target/ga-opencl.chk --csv rust/target/ga-opencl.csv --json rust/target/ga-opencl.json
      - name: Rust GA hybrid smoke test
        run: cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend hybrid --population 64 --generations 3 --islands 4 --min 1 --max 100000 --threads 4 --seed 42 --checkpoint rust/target/ga-hybrid.chk --csv rust/target/ga-hybrid.csv --json rust/target/ga-hybrid.json
      - name: Build C++ reference for cross-language parity
        run: |
          cmake -S . -B build-parity -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCOLLATZ_ENABLE_OPENCL=OFF
          cmake --build build-parity --parallel 2
      - name: Compare seeded C++ and Rust GA checkpoints
        run: |
          ./build-parity/scollatz-ga --backend cpu --population 64 --generations 6 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint build-parity/cpp-full.chk --csv build-parity/cpp.csv --json build-parity/cpp.json
          cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend cpu --population 64 --generations 6 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint build-parity/rust-full.chk --csv build-parity/rust.csv --json build-parity/rust.json
          python3 - <<'PY'
          import json
          a=json.load(open('build-parity/cpp-full.chk'))
          b=json.load(open('build-parity/rust-full.chk'))
          for k in ('version','generation','seed','rng','populations'):
              assert a[k] == b[k], f'C++/Rust seeded GA mismatch in {k}'
          print('C++ and Rust seeded GA checkpoints match exactly')
          PY
      - name: Verify C++ checkpoint can resume in Rust
        run: |
          ./build-parity/scollatz-ga --backend cpu --population 64 --generations 3 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint build-parity/cpp-part.chk --csv build-parity/cpp-part.csv --json build-parity/cpp-part.json
          cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend cpu --population 64 --generations 6 --islands 4 --min 1 --max 100000 --threads 2 --resume build-parity/cpp-part.chk --checkpoint build-parity/rust-resumed.chk --csv build-parity/rust-resumed.csv --json build-parity/rust-resumed.json
          python3 - <<'PY'
          import json
          a=json.load(open('build-parity/cpp-full.chk')); b=json.load(open('build-parity/rust-resumed.chk'))
          assert all(a[k] == b[k] for k in ('version','generation','seed','rng','populations'))
          print('Rust resumed the C++ checkpoint to the exact C++ state')
          PY
      - name: Verify Rust checkpoint can resume in C++
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --bin scollatz-ga -- --backend cpu --population 64 --generations 3 --islands 4 --min 1 --max 100000 --threads 2 --seed 42 --checkpoint build-parity/rust-part.chk --csv build-parity/rust-part.csv --json build-parity/rust-part.json
          ./build-parity/scollatz-ga --backend cpu --population 64 --generations 6 --islands 4 --min 1 --max 100000 --threads 2 --resume build-parity/rust-part.chk --checkpoint build-parity/cpp-resumed.chk --csv build-parity/cpp-resumed.csv --json build-parity/cpp-resumed.json
          python3 - <<'PY'
          import json
          a=json.load(open('build-parity/cpp-full.chk')); b=json.load(open('build-parity/cpp-resumed.chk'))
          assert all(a[k] == b[k] for k in ('version','generation','seed','rng','populations'))
          print('C++ resumed the Rust checkpoint to the exact C++ state')
          PY
