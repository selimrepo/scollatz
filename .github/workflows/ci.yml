name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and OpenCL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ocl-icd-opencl-dev pocl-opencl-icd
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: OpenCL smoke test (PoCL CPU device)
        run: ./build/scollatz --start 1 --end 10000 --backend opencl --chunk 1024
      - name: Genetic algorithm smoke test
        run: ./build/scollatz-ga --population 64 --generations 5 --min 1 --max 100000 --threads 2 --seed 42
